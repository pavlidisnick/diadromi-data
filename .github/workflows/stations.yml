name: Stations

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build from OpenStreetMap
        run: python build.py
      - name: Check
        run: python check.py stations.csv
      - name: Commit if the list changed
        run: |
          if git diff --quiet -- stations.csv; then
            echo "No change"
            git checkout -- stations-ODbL.txt
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stations.csv stations-ODbL.txt
          git commit -m "Stations: $(($(wc -l < stations.csv) - 1)) stations"
          git push
